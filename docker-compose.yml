version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: sdq_postgres
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: sdadmin
      POSTGRES_PASSWORD: sdpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdadmin -d servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sdq_backend
    environment:
      DATABASE_URL: postgresql://sdadmin:sdpassword@postgres:5432/servicedesk
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENVIRONMENT: production
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: sdq_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
